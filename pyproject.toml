[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bina-az-scraper"
version = "0.1.0"
description = "Polite, selector-driven scraper for bina.az property listings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]

[project.scripts]
bina-scraper = "bina_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["bina_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
